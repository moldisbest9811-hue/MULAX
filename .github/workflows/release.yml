name: Build MULAX update release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build update package and SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          excluded_dirs = {
              ".git", ".github", "__pycache__", "models",
              "data", "backups", ".venv", "venv"
          }
          excluded_files = {
              "updater_config.json", "updater.py", "start_mulax.py",
              "mulax-update.zip", "manifest.json"
          }

          files = {}
          with zipfile.ZipFile("mulax-update.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path(".").rglob("*")):
                  if not path.is_file():
                      continue
                  rel = path.as_posix().removeprefix("./")
                  parts = Path(rel).parts
                  if any(part in excluded_dirs for part in parts):
                      continue
                  if path.name in excluded_files:
                      continue
                  if rel.startswith(".github/"):
                      continue
                  data = path.read_bytes()
                  archive.writestr(rel, data)
                  files[rel] = hashlib.sha256(data).hexdigest()

              archive.writestr(
                  "manifest.json",
                  json.dumps({"files": files}, indent=2) + "\n"
              )

          if not files:
              raise SystemExit("No application files found. Push the MULAX source before tagging a release.")
          print(f"Packaged {len(files)} files.")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mulax-update.zip
